name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# TASK-024: the supply-chain job writes the checksums and the SBOM, and a tag
# push gets a draft release with everything attached. Publishing stays a human
# decision; TASK-026 covers the trial release and its feedback.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          # Default build: standard-library JSON backend, ~41% smaller.
          # Add -tags=sonic for the faster, larger JSON backend.
          go build -trimpath -ldflags "-s -w" \
            -o "dist/envsub-${GOOS}-${GOARCH}${EXT}" ./cmd/envsub
      - uses: actions/upload-artifact@v4
        with:
          name: envsub-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  supply-chain:
    runs-on: ubuntu-latest
    needs: build
    # Only the release step needs to write; the build jobs stay read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          # Only the binaries: the pattern does not match SHA256SUMS or the SBOM.
          sha256sum envsub-* > SHA256SUMS
          cat SHA256SUMS
      - name: Check the manifest covers every artifact
        run: |
          cd dist
          artifacts=$(ls envsub-* | wc -l)
          checksums=$(wc -l < SHA256SUMS)
          echo "artifacts=$artifacts checksums=$checksums"
          test "$artifacts" -eq "$checksums"
      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/envsub.spdx.json
          artifact-name: envsub.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: envsub-supply-chain
          path: |
            dist/SHA256SUMS
            dist/envsub.spdx.json
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/envsub-*
            dist/SHA256SUMS
            dist/envsub.spdx.json
