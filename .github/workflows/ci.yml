name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Verify modules
        run: go mod verify
      - name: Format
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./test)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Test with the sonic JSON backend
        run: go test -tags=sonic -count=1 ./...

  # TASK-106: fuzz every parser. The seeds run as ordinary tests in the `test`
  # job; this job is what actually fuzzes each target, which is what catches a
  # new panic. A failure writes the offending input to the package's testdata
  # and fails the job.
  fuzz:
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Fuzz the scanner, the path grammar, the .env parser, the expression parser and the number ladder
        run: |
          go test -run '^$' -fuzz '^FuzzTemplateScanner$' -fuzztime=20s ./test/fuzz/
          go test -run '^$' -fuzz '^FuzzTemplateSpans$' -fuzztime=20s ./test/fuzz/
          go test -run '^$' -fuzz '^FuzzPathParser$' -fuzztime=20s ./test/fuzz/
          go test -run '^$' -fuzz '^FuzzDotenvParser$' -fuzztime=20s ./test/fuzz/
          go test -run '^$' -fuzz '^FuzzExpressionPaths$' -fuzztime=20s ./test/fuzz/
          go test -run '^$' -fuzz '^FuzzNumberText$' -fuzztime=20s ./test/fuzz/
          go test -run '^$' -fuzz '^FuzzParseExpression$' -fuzztime=20s ./internal/engine/extended/
          go test -run '^$' -fuzz '^FuzzStreamWindow$' -fuzztime=20s ./internal/engine/extended/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: the configuration uses the v2 schema.
          version: v2.14.0
          args: --timeout=5m

  # TASK-024: fails when a vulnerability is reachable from the module graph or
  # is actually called by the code. The version is pinned to the one verified
  # locally; `just vuln` runs the same command.
  security:
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The runnable examples drive the CLI end to end (batch, in-place, stdin,
  # filters, acceptance tree). `just` must be at least the version the recipes
  # are written for; see the guard in the root justfile.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.59.0'
      - name: Runnable examples
        run: just --justfile examples/justfile demo

  perf:
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      # Shared runners are noisy; the ratios keep the REF-04 limits (5x time,
      # 5x RSS) and the absolute startup budget of 100ms.
      PERF_RUNS: '9'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Install GNU envsubst baseline
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: Performance gate
        run: go test -count=1 -v ./test/perf
