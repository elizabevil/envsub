version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic
    - misspell

issues:
  # Report every finding: the defaults silently cap repeated issues per linter.
  max-issues-per-linter: 0
  max-same-issues: 0
